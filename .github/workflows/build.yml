name: CI

env:
  SM_VERSION: "1.11"

permissions:
  contents: write

on:
  push:
    branches: [ master, main ]
    tags: [ "*" ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup SourceMod 1.11
        shell: bash
        run: |
          set -euo pipefail
          url="$(curl -s https://sm.alliedmods.net/smdrop/${SM_VERSION}/ | grep -o 'sourcemod-1.11[^"]*-linux.tar.gz' | sort -V | tail -n1)"
          curl -sL -o /tmp/sm.tar.gz "https://sm.alliedmods.net/smdrop/${SM_VERSION}/${url}"
          mkdir -p /tmp/sm
          tar xzf /tmp/sm.tar.gz -C /tmp/sm --strip-components=1

      - name: Fetch GOKZ include deps
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh deps

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          SM_DIR=/tmp/sm ./build.sh

      - name: Verify single smx
        shell: bash
        run: |
          ls -la addons/sourcemod/plugins/stratosphere.smx
          test "$(ls addons/sourcemod/plugins/*.smx 2>/dev/null | wc -l)" = "1"

      - uses: actions/upload-artifact@v4
        with:
          name: stratosphere-${{ github.sha }}
          path: |
            addons/sourcemod/plugins/stratosphere.smx
            addons/sourcemod/translations/stratosphere.phrases.txt
