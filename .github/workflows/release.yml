name: Release

env:
  SM_VERSION: "1.11"

permissions:
  contents: write

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    # workflow_dispatch on other branches should still be runnable; skip release logic outside main/master except manual
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check skip ci (version bump commit)
        id: check
        shell: bash
        run: |
          set -euo pipefail
          MSG="$(git log -1 --pretty=%B || true)"
          echo "Last commit message: $MSG"
          if echo "$MSG" | grep -q "\[skip ci\]"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "This is a version bump commit, will skip release to avoid loop."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SourceMod 1.11
        if: steps.check.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          url="$(curl -s https://sm.alliedmods.net/smdrop/${SM_VERSION}/ | grep -o 'sourcemod-1.11[^"]*-linux.tar.gz' | sort -V | tail -n1)"
          echo "SM package: $url"
          curl -sL -o /tmp/sm.tar.gz "https://sm.alliedmods.net/smdrop/${SM_VERSION}/${url}"
          mkdir -p /tmp/sm
          tar xzf /tmp/sm.tar.gz -C /tmp/sm
          chmod +x /tmp/sm/addons/sourcemod/scripting/spcomp* || true
          ls -lh /tmp/sm/addons/sourcemod/scripting/spcomp* 2>&1 | head -n 20
          /tmp/sm/addons/sourcemod/scripting/spcomp64 -h 2>&1 | head -n 20 || true

      - name: Determine next version (auto bump patch)
        if: steps.check.outputs.skip == 'false'
        id: version
        shell: bash
        run: |
          set -euo pipefail
          CUR="$(grep -E '#define ST_VERSION' addons/sourcemod/scripting/stratosphere.sp | sed -E 's/.*\"([^\"]+)\".*/\1/')"
          if [ -z "$CUR" ]; then echo "Failed to parse ST_VERSION"; exit 1; fi
          echo "File version: $CUR"
          git fetch --tags --force 2>&1 | head -n 20 || true
          LATEST="$(git tag --list 'v*' | sort -V | tail -n1 || true)"
          if [ -z "$LATEST" ]; then LATEST="v0.0.0"; fi
          LATEST_VER="${LATEST#v}"
          echo "Latest tag: $LATEST ($LATEST_VER)"
          BASE="$(printf "%s\n%s\n" "$CUR" "$LATEST_VER" | sort -V | tail -n1)"
          echo "Base: $BASE"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          MAJOR="${MAJOR:-0}"; MINOR="${MINOR:-0}"; PATCH="${PATCH:-0}"
          MAJOR="$(echo "$MAJOR" | grep -oE '[0-9]+' | head -n1 || echo 0)"
          MINOR="$(echo "$MINOR" | grep -oE '[0-9]+' | head -n1 || echo 0)"
          PATCH="$(echo "$PATCH" | grep -oE '[0-9]+' | head -n1 || echo 0)"
          NEXT_PATCH=$((PATCH + 1))
          NEXT="${MAJOR}.${MINOR}.${NEXT_PATCH}"
          TAG="v${NEXT}"
          echo "Next: $NEXT ($TAG)"
          while git rev-parse "$TAG" >/dev/null 2>&1; do
            echo "Tag $TAG already exists, incrementing patch"
            IFS='.' read -r MAJ MIN PAT <<< "${TAG#v}"
            PAT=$((PAT + 1))
            TAG="v${MAJ}.${MIN}.${PAT}"
            NEXT="${TAG#v}"
            echo "Trying $TAG"
          done
          echo "Resolved: $NEXT ($TAG)"
          echo "cur=$CUR" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Bump version in source
        if: steps.check.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          NEXT="${{ steps.version.outputs.next }}"
          echo "Bumping ST_VERSION to $NEXT"
          sed -i -E "s/#define ST_VERSION \"[^\"]+\"/#define ST_VERSION \"$NEXT\"/" addons/sourcemod/scripting/stratosphere.sp
          grep -n "ST_VERSION" addons/sourcemod/scripting/stratosphere.sp
          if ! git diff --quiet -- addons/sourcemod/scripting/stratosphere.sp; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add addons/sourcemod/scripting/stratosphere.sp
            git commit -m "chore: bump version to v$NEXT [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
            echo "Version bump pushed"
          else
            echo "No diff, skip push"
          fi

      - name: Fetch GOKZ include deps
        if: steps.check.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh deps

      - name: Build (strict, -E warnings-as-errors)
        if: steps.check.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          STRICT=1 SM_DIR=/tmp/sm ./build.sh

      - name: Verify single smx
        if: steps.check.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          ls -lh addons/sourcemod/plugins/stratosphere.smx
          count="$(ls addons/sourcemod/plugins/*.smx 2>/dev/null | wc -l)"
          if [ "$count" != "1" ]; then
            echo "Expected exactly 1 smx, got $count"
            ls -la addons/sourcemod/plugins/
            exit 1
          fi

      - name: Package release zip (ready-to-install)
        if: steps.check.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          NEXT="${{ steps.version.outputs.next }}"
          PKG="package"
          rm -rf "$PKG" dist
          mkdir -p "$PKG/addons/sourcemod/plugins"
          mkdir -p "$PKG/cfg_examples/sourcemod/gokz"
          mkdir -p dist
          cp addons/sourcemod/plugins/stratosphere.smx "$PKG/addons/sourcemod/plugins/"
          cp cfg/sourcemod/gokz/gokz-stratosphere.cfg "$PKG/cfg_examples/sourcemod/gokz/gokz-stratosphere.cfg.example"
          (cd "$PKG" && zip -r "../dist/stratosphere-${TAG}.zip" .)
          ls -lh dist/
          unzip -l "dist/stratosphere-${TAG}.zip"
          echo "ZIP=dist/stratosphere-${TAG}.zip" >> "$GITHUB_ENV"

      - name: Create and push tag
        if: steps.check.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          git fetch --tags --force 2>&1 | head -n 5 || true
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally, skipping create"
          else
            git tag "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "Tag $TAG pushed"
          fi
          git tag --list | sort -V | tail -n 10

      - name: Create GitHub Release (publish)
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifact (backup)
        if: steps.check.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: stratosphere-${{ steps.version.outputs.tag }}
          path: dist/*.zip
          retention-days: 90
